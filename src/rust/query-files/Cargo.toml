[package]
name = "fit-query-files"
version = "0.2.4"
edition = "2024"
rust-version = "1.93"
build = "../build_info.rs"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive", "string"] }
fit-inspector = { path = "../inspector" }
jiff = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
serde_yaml_ng = "0.10"
unicode-width = "0.2"
