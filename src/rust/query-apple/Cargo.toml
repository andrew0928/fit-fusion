[package]
name = "fit-query-apple"
version = "0.2.4"
edition = "2024"
rust-version = "1.93"
publish = false
build = "../build_info.rs"

[dependencies]
clap = { version = "4.6", features = ["derive", "string"] }
fit-inspector = { path = "../inspector" }
jiff = { version = "1", features = ["serde"] }
quick-xml = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "4", default-features = false, features = ["deflate"] }
serde_yaml_ng = "0.10"
tempfile = "3"
unicode-width = "0.2"
