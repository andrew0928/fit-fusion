[package]
name = "fit-fusion"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[dependencies]
fit-inspector = { path = "../inspector" }
rustyfit = "=0.11.2"
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
rustix = { version = "1", features = ["fs"] }
jsonschema = { version = "0.33", default-features = false }
serde = "1"
jiff = "1"
ureq = "2.12"
base64 = "0.22"
zip = { version = "4", default-features = false, features = ["deflate"] }
