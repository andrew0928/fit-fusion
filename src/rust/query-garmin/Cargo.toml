[package]
name = "fit-query-garmin"
version = "0.2.4"
edition = "2024"
rust-version = "1.93"
build = "../build_info.rs"
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive", "string"] }
fit-inspector = { path = "../inspector" }
jiff = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2.12"
base64 = "0.22"
zip = { version = "4", default-features = false, features = ["deflate"] }
sha2 = "0.10"
tempfile = "3"
serde_yaml_ng = "0.10"
unicode-width = "0.2"
