# Optional personal settings for fit-query-* at ~/.fit-fusion/config.yaml.
# Uncomment version and the sections you use. CLI flags override these settings.
# Relative paths start at this file's directory. Absolute paths and ~/ also work.

# version: 1

# common:
#   # Time zone for activity dates. The built-in default is Asia/Taipei.
#   timezone: Asia/Taipei

# tools:
#   fit-query-files:
#     # Directory of FIT files. If omitted, pass --dir.
#     dir: ~/Cycling/Bryton
#
#   fit-query-apple:
#     # Apple Health export ZIP. If omitted, pass --archive.
#     archive: ~/Downloads/apple-health-export.zip
#
#   fit-query-garmin:
#     # Dotenv file for online queries. If omitted, use .env in the working directory.
#     env_file: garmin.env
#     # Directory for original FIT files. The value shown is the built-in default.
#     cache_dir: ~/Library/Caches/fit-query-garmin
